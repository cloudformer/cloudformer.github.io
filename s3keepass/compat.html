<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>s3keepass kdbx compatibility</title>
<meta name="description" content="Which local KeePass apps open a .kdbx from s3keepass, and from which version. Read live from the s3keepass page on PyPI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* The table's content lives in one place: the "Local KeePass apps" section of s3keepass's README on PyPI
   (between <!-- compat:start --> and <!-- compat:end -->, one block per language). This page only draws it. */
:root {
  --paper: #f2f4f6; --sheet: #ffffff; --ink: #121a22; --muted: #5b6874; --grid: #c3cad5; --head: #eef1f5;
  --accent: #0a6e5c; --no: #b4372f; --no-bg: #fbe9e7; --warn: #9a5b0b; --warn-bg: #fff1d9; --ok: #1f7a4a; --ok-bg: #e2f2e8;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e1418; --sheet: #151d23; --ink: #e6ecf0; --muted: #93a1ad; --grid: #34414b; --head: #1b252c;
  --accent: #4fd1b0; --no: #f0857a; --no-bg: #3a1d1b; --warn: #f2b35c; --warn-bg: #3a2c12; --ok: #5fd08e; --ok-bg: #16322a;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0e1418; --sheet: #151d23; --ink: #e6ecf0; --muted: #93a1ad; --grid: #34414b; --head: #1b252c;
  --accent: #4fd1b0; --no: #f0857a; --no-bg: #3a1d1b; --warn: #f2b35c; --warn-bg: #3a2c12; --ok: #5fd08e; --ok-bg: #16322a;
  color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-underline-offset: 3px; }
code { font-family: var(--mono); font-size: .88em; }
main { max-width: 72rem; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font: 700 1.6rem/1.25 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.langs { display: inline-flex; border: 1.5px solid var(--grid); border-radius: 999px; overflow: hidden; }
.langs button { font: 600 .9rem/1 var(--body); color: var(--muted); background: var(--sheet); border: 0; padding: .5rem .9rem; cursor: pointer; }
.langs button[aria-pressed="true"] { color: var(--sheet); background: var(--ink); }
.langs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.wrap { overflow-x: auto; background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid var(--grid); border-left: 1px solid var(--grid); padding: 10px 8px; text-align: center; vertical-align: middle; }
th:first-child, td:first-child { border-left: 0; }
tr:last-child td { border-bottom: 0; }
thead th { background: var(--head); }
.plat { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.client { font-size: .92rem; font-weight: 600; }
.rowh { text-align: left; background: var(--head); width: 170px; }
.st { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; line-height: 1.3; }
.mark { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: .85rem; font-weight: 700; }
.m-no { color: var(--no); background: var(--no-bg); } .m-warn { color: var(--warn); background: var(--warn-bg); } .m-ok { color: var(--ok); background: var(--ok-bg); }
.v { font-family: var(--mono); font-size: .88rem; white-space: nowrap; }
.na { color: var(--muted); font-family: var(--body); font-size: .8rem; }
.r-no .v:not(.na) { color: var(--no); }
td.hit-ok { background: var(--ok-bg); } td.hit-warn { background: var(--warn-bg); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 24px; margin: 0; padding: 0; list-style: none; }
.legend li { display: flex; align-items: center; gap: 8px; }
.notes { background: var(--sheet); border: 1px solid var(--grid); border-radius: 10px; padding: 14px 18px; }
.notes ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; max-width: 80ch; }
.src, .from { font-size: .82rem; color: var(--muted); margin: 0; }
.state { color: var(--muted); }
@media (max-width: 480px) { h1 { font-size: 1.3rem; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">s3keepass kdbx compatibility for local apps</h1>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="zh" aria-pressed="false" lang="zh-CN">CN</button>
    </div>
  </header>
  <div id="body"><p class="state">Reading the table from PyPI…</p></div>
  <p class="from" id="from"></p>
</main>
<script>
(function () {
  var PKG = "s3keepass", PYPI = "https://pypi.org/project/" + PKG + "/";
  var blocks = null, version = "", current = location.hash === "#zh" ? "zh" : "en";
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // the little Markdown the section uses: `code`, [text](https://…), \*
  function inline(s) {
    return esc(s).replace(/\\\*/g, "*").replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2">$1</a>');
  }
  function cells(line) { return line.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }); }

  // one language block of the README → {title, head, rows, legend, notes, sources}
  function parse(text) {
    var b = { title: "", head: null, rows: [], legend: [], notes: [], sources: "" };
    text.split("\n").forEach(function (line) {
      var t = line.trim(), m;
      if (/^###\s/.test(t)) b.title = t.replace(/^###\s+/, "");
      else if (/^\|/.test(t)) { if (/^\|[\s|:-]+\|$/.test(t)) return; if (!b.head) b.head = cells(t); else b.rows.push(cells(t)); }
      else if ((m = /^- (.*)/.exec(t))) b.legend.push(m[1]);
      else if ((m = /^\d+\. (.*)/.exec(t))) b.notes.push(m[1]);
      else if (/^(Sources|来源)/.test(t)) b.sources = t;
    });
    return b;
  }
  function split(desc) {
    var a = desc.indexOf("<!-- compat:start -->"), z = desc.indexOf("<!-- compat:end -->");
    if (a < 0 || z < a) return null;
    var out = {}, parts = desc.slice(a, z).split(/<!-- compat:(en|zh) -->/);
    for (var i = 1; i < parts.length; i += 2) out[parts[i]] = parse(parts[i + 1]);
    return out.en ? out : null;
  }

  var MARKS = { "✕": "no", "!": "warn", "✓": "ok" };
  function mark(kind, sym) { return '<span class="mark m-' + kind + '">' + sym + "</span>"; }
  function table(b) {
    // header "Platform · App": the platforms become a first row, consecutive ones merged
    var cols = b.head.slice(1).map(function (h) { var i = h.indexOf(" · "); return i < 0 ? ["", h] : [h.slice(0, i), h.slice(i + 3)]; });
    var plat = "", top = "<tr><th class=\"rowh\" rowspan=\"2\"></th>";
    for (var i = 0; i < cols.length; i++) {
      if (cols[i][0] === plat && i) continue;
      plat = cols[i][0];
      var n = 1; while (i + n < cols.length && cols[i + n][0] === plat) n++;
      top += '<th class="plat" colspan="' + n + '">' + inline(plat) + "</th>";
    }
    var second = "<tr>" + cols.map(function (c) { return '<th class="client">' + inline(c[1]) + "</th>"; }).join("") + "</tr>";
    var body = b.rows.map(function (r) {
      var sym = r[0].charAt(0), kind = MARKS[sym], label = kind ? r[0].slice(1).trim() : r[0];
      var head = '<td class="rowh"><div class="st">' + (kind ? mark(kind, sym) : "") + inline(label) + "</div></td>";
      return '<tr class="r-' + (kind || "extra") + '">' + head + r.slice(1).map(function (c) {
        var none = c === "—" || !/\d/.test(c), hit = none ? "" : kind === "ok" || !kind ? "hit-ok" : kind === "warn" ? "hit-warn" : "";
        return '<td class="' + hit + '"><span class="v' + (none ? " na" : "") + '">' + inline(c) + "</span></td>";
      }).join("") + "</tr>";
    }).join("");
    return '<div class="wrap"><table><thead>' + top + "</tr>" + second + "</thead><tbody>" + body + "</tbody></table></div>";
  }
  function legend(b) {
    return '<ul class="legend">' + b.legend.map(function (l) {
      var sym = l.charAt(0), kind = MARKS[sym];
      return "<li>" + (kind ? mark(kind, sym) + inline(l.slice(1).trim()) : inline(l)) + "</li>";
    }).join("") + "</ul>";
  }

  function render() {
    document.documentElement.lang = current === "zh" ? "zh-CN" : "en";
    Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (x) {
      x.setAttribute("aria-pressed", String(x.getAttribute("data-lang") === current));
    });
    if (!blocks) return;
    var b = blocks[current] || blocks.en;
    $("title").textContent = document.title = b.title;
    $("body").innerHTML = '<div style="display:grid;gap:22px">' + table(b) + legend(b) +
      (b.notes.length ? '<section class="notes"><ol>' + b.notes.map(function (n) { return "<li>" + inline(n) + "</li>"; }).join("") + "</ol></section>" : "") +
      (b.sources ? '<p class="src">' + inline(b.sources) + "</p>" : "") + "</div>";
    $("from").innerHTML = (current === "zh" ? "内容来自 " : "Read from ") + '<a href="' + PYPI + '">' + PKG + " " + esc(version) +
      (current === "zh" ? " 在 PyPI 上的页面</a>" : " on PyPI</a>") + ' · <a href="../">IdleFree</a>';
  }

  Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (x) {
    x.addEventListener("click", function () {
      current = x.getAttribute("data-lang");
      history.replaceState(null, "", current === "zh" ? "#zh" : location.pathname);
      render();
    });
  });
  addEventListener("hashchange", function () { current = location.hash === "#zh" ? "zh" : "en"; render(); });

  fetch("https://pypi.org/pypi/" + PKG + "/json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { version = d.info.version; blocks = split(d.info.description || ""); if (!blocks) throw 0; render(); })
    .catch(function () {
      $("body").innerHTML = '<p class="state">The table could not be read from PyPI just now. It is on <a href="' + PYPI +
        '#local-keepass-apps">the s3keepass page on PyPI</a>.</p>';
    });
  render();
})();
</script>
</body>
</html>
